# MTT Menejer Diagnostika — lokal ishlab chiqish muhiti
# Backend (FastAPI) + PostgreSQL 15 xizmatlari

services:
  db:
    image: postgres:15
    container_name: mtt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtt}
      POSTGRES_DB: ${POSTGRES_DB:-mtt_diagnostika}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtt} -d ${POSTGRES_DB:-mtt_diagnostika}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtt_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mtt}:${POSTGRES_PASSWORD:-mtt}@db:5432/${POSTGRES_DB:-mtt_diagnostika}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
